<!-- https://giscus.app/ -->
<script>
  (function () {
    const lightTheme = '{{ '/assets/css/giscus-light.css' | absolute_url }}';
    const darkTheme = '{{ '/assets/css/giscus-dark.css' | absolute_url }}';
    const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme() {
      const mode = document.documentElement.getAttribute('data-mode');
      const dark = mode ? mode === 'dark' : colorScheme.matches;
      return dark ? darkTheme : lightTheme;
    }

    function updateGiscusTheme() {
      const frame = document.querySelector('.giscus-frame');
      if (!frame || !frame.contentWindow) {
        return;
      }

      frame.contentWindow.postMessage(
        {
          giscus: {
            setConfig: {
              theme: currentTheme()
            }
          }
        },
        'https://giscus.app'
      );
    }

    let lang = '{{ site.comments.giscus.lang | default: lang }}';
    {%- comment -%} https://github.com/giscus/giscus/tree/main/locales {%- endcomment -%}
    if (lang.length > 2 && !lang.startsWith('zh')) {
      lang = lang.slice(0, 2);
    }

    const giscusAttributes = {
      src: 'https://giscus.app/client.js',
      'data-repo': '{{ site.comments.giscus.repo }}',
      'data-repo-id': '{{ site.comments.giscus.repo_id }}',
      'data-category': '{{ site.comments.giscus.category }}',
      'data-category-id': '{{ site.comments.giscus.category_id }}',
      'data-mapping': '{{ site.comments.giscus.mapping | default: 'pathname' }}',
      'data-strict': '{{ site.comments.giscus.strict | default: '0' }}',
      'data-reactions-enabled': '{{ site.comments.giscus.reactions_enabled | default: '1' }}',
      'data-emit-metadata': '0',
      'data-theme': currentTheme(),
      'data-input-position': '{{ site.comments.giscus.input_position | default: 'bottom' }}',
      'data-lang': lang,
      'data-loading': 'lazy',
      crossorigin: 'anonymous',
      async: ''
    };

    const giscusNode = document.createElement('script');
    Object.entries(giscusAttributes).forEach(([key, value]) =>
      giscusNode.setAttribute(key, value)
    );

    const footer = document.querySelector('footer');
    if (footer) {
      footer.insertAdjacentElement('beforebegin', giscusNode);
    }

    addEventListener('message', (event) => {
      if (event.source === window && event.data && event.data.id === 'theme-mode') {
        updateGiscusTheme();
      }
    });

    new MutationObserver(updateGiscusTheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-mode']
    });

    colorScheme.addEventListener('change', () => {
      if (!document.documentElement.hasAttribute('data-mode')) {
        updateGiscusTheme();
      }
    });
  })();
</script>
